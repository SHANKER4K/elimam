events {}

http {
    # nginx resolves a literal proxy_pass hostname once, at startup. A backend
    # container recreated by `docker compose up -d --build` gets a new IP, and
    # every request then 502s with `connect() failed (111: Connection refused)`
    # until nginx is restarted. With a resolver plus a variable in proxy_pass
    # (variables are required for request-time resolution), nginx re-resolves
    # and picks up the new address within `valid`.
    # 127.0.0.11 is Docker's embedded DNS; this file is only used in compose.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name api.elimam.com;

        location / {
            set $backend_upstream backend:8000;
            proxy_pass http://$backend_upstream;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
