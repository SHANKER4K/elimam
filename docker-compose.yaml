
services:
  backend:
    expose:
      - "8000"
    build:
      context: .
      dockerfile: Dockerfile
    image: elimam:latest
    container_name: backend
    restart: unless-stopped
    depends_on:
      - embedding
      - reranker
    # ponytail: no published port - the Next.js proxy is the only entry point.
    # Reachable on the compose network as http://backend:8000 (nginx/bot).

    environment:
      # Vector search
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}

      # Database
      - DATABASE_HOST=${DATABASE_HOST}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_PORT=5432

      # Opik tracing: logfire exports Pydantic AI spans over OTLP.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_METRICS_EXPORTER=none

      # Security - shared secret must match the telegram service below.
      - BOT_SHARED_SECRET=${BOT_SHARED_SECRET}
      # Persist model caches across restarts: HF hub cache (GATE-AraBert-v1
      # original) bind-mounted from host, fastembed BM25 in the named volume.
      - HF_HOME=/models/hf
      - XDG_CACHE_HOME=/models/cache

    volumes:
      - ./skills/turath-index-skill.md:/app/skills/turath-index-skill
      - ./.env:/app/.env:ro
      - /home/ismail/.cache/huggingface:/models/hf
      - model_cache:/models

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/chat/health')"]
      interval: 120s
      timeout: 5s
      retries: 5
      start_period: 120s

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: elimam_embedding
    restart: unless-stopped

    command:
      - --model-id
      - Omartificial-Intelligence-Space/GATE-AraBert-v1

    volumes:
      - ./models/gate-arabert:/data

    ports:
      - "8080:80"


  reranker:
    build:
      context: ./reranker
      dockerfile: Dockerfile

    image: elimam-reranker:latest
    container_name: elimam_reranker

    restart: unless-stopped

    expose:
      - "80"

    volumes:
      - ./models/reranker:/data

    environment:
      HF_HOME: /data
      TRANSFORMERS_CACHE: /data
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    cpus: "2.5"
    mem_limit: 3g

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    container_name: elimam_nginx
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:20128:20128"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - omniroute-data:/app/data
      - ./.omniroute:/app/.omniroute # Adjust '/app/.omniroute' if the destination path inside the container is different

volumes:
  pgdata:
  model_cache:
  omniroute-data:
